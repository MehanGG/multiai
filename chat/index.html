function readFile(f){return new Promise(res=>{const r=new FileReader();

 else{r.onload=()=>res({name:f.name,kind:'bin',mime:f.type||'application/octet-stream',data:r.result.split(',')[1]});r.readAsDataURL(f)}})}

function sysPrompt(){return `${S.set.persona?`Kamu adalah ${mname(mdl())}, asisten AI di aplikasi MultiAI. Perkenalkan dirimu dengan nama itu.`:`Kamu adalah asisten AI di aplikasi MultiAI, dijalankan oleh model ${mname(mdl())} dari Google.`}${['ultra','max'].includes(S.set.effort)?' Pikirkan dengan sangat teliti dan periksa ulang jawabanmu sebelum menjawab.':''}${S.set.web&&webOK()?' Kamu punya akses pencarian web; pakai untuk info terbaru.':''} Jika pengguna meminta link, video, artikel, atau sumber: cari lewat web, lalu tulis tiap hasil sebagai link Markdown [judul](url) dengan URL asli dari hasil pencarian dan jangan mengarang URL. Jika tidak menemukan link langsung, beri link pencarian, misalnya https://www.youtube.com/results?search_query=kata+kunci untuk video YouTube. Jawab dalam bahasa yang dipakai pengguna. Kamu bisa MEMBUAT FILE. Tulis tiap file sebagai satu blok kode dengan format \`\`\`bahasa namafile.ext; aplikasi akan mengubahnya jadi file yang bisa dilihat, diunduh, dan disalin. Jangan pernah bilang kamu tidak bisa membuat file. Jika isi file sendiri mengandung tanda tiga backtick, bungkus file itu dengan empat backtick. Pembuka dan penutup blok kode harus berada di barisnya sendiri. Format: html = satu file lengkap dengan CSS dan JS inline (langsung jalan di preview tanpa hosting); pptx = Markdown, tiap slide dipisah baris ---, slide pertama berisi "# Judul" dan "## Subjudul", slide lain "# Judul slide" lalu poin "- ..."; pdf dan docx = Markdown (#, ##, ###, daftar -, 1., **tebal**, tabel | a | b |); xlsx = isi CSV; py, js, css, json, md, txt, csv dan lainnya = isi file apa adanya. png, jpg, webp = gambar: kalau isi blok adalah kode SVG lengkap, aplikasi mengubahnya jadi gambar; kalau isinya deskripsi gambar (bahasa Inggris, rinci), aplikasi membuat gambarnya dengan model gambar. svg = kode SVG. zip, mcpack, mcaddon, mcworld, mctemplate = paket berisi banyak file: tulis tiap file diawali satu baris '=== path/nama-file' (contoh '=== BP/manifest.json')  if(r.body&&r.body.getReader){const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){if(ctrl.stop){rd.cancel();break}const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();ls.forEach(l=>{if(l.startsWith('data:'))onData(l.slice(5).trim())});draw()}}
 else{(await r.text()).split('\n').forEach(l=>{if(l.startsWith('data:'))onData(l.slice(5).trim())});draw()}}
async function callGemini(ref,c,ai,hist,draw){let uin=0,uout=0;const rid=ref.m;
 const post=(gc,wt=true)=>pfetch('https://generativelanguage.googleapis.com/v1beta/models/'+rid+':streamGenerateContent?alt=sse',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':keyOf('gemini')},body:JSON.stringify({systemInstruction:{parts:[{text:sysPrompt()}]},contents:hist,generationConfig:gc,...(S.set.web&&wt?{tools:[{google_search:{}}]}:{})})});
 const gc=genCfg(rid);let r=await post(gc);
 if(r.status===400&&gc.thinkingConfig){delete gc.thinkingConfig;r=await post(gc)}
 if(r.status===400&&Object.keys(gc).length){r=await post({})}
 if(r.status===400&&S.set.web){r=await post({},false)}
 if(!r.ok)throw new Error(await errText(r,rid,c));
 await readSSE(r,d=>{let j;try{j=JSON.parse(d)}catch(_){return}const cd=j.candidates&&j.candidates[0];
  ((cd&&cd.content&&cd.content.parts)||[]).forEach(q=>{if(!q.text)return;if(q.thought)ai.think=(ai.think||'')+q.text;else{ai.text+=q.text;got(ai)}});
  ai.src=ai.src||[];((cd&&cd.groundingMetadata&&cd.groundingMetadata.groundingChunks)||[]).forEach(g=>{if(g.web&&!ai.src.some(x=>x.u===g.web.uri))ai.src.push({u:g.web.uri,t:g.web.title||g.web.uri})});
  if(j.usageMetadata){uin=j.usageMetadata.promptTokenCount||uin;uout=((j.usageMetadata.candidatesTokenCount||0)+(j.usageMetadata.thoughtsTokenCount||0))||uout}},draw);
 return{in:uin,out:uout}}
async function callOpenAI(ref,c,ai,hist,draw){let uin=0,uout=0;const rid=ref.m,em={low:'low',medium:'medium',high:'high',ultra:'high',max:'max'}[S.set.effort]||'medium';
 const input=hist.map(h=>({role:h.role==='model'?'assistant':'user',content:h.parts.map(q=>{if(q.text!=null)return{type:h.role==='model'?'output_text':'input_text',text:q.text};
  const mt=q.inlineData.mimeType,d=q.inlineData.data;if(/^image\//.test(mt))return{type:'input_image',image_url:'data:'+mt+';base64,'+d};if(mt==='application/pdf')return{type:'input_file',filename:'dokumen.pdf',file_data:'data:'+mt+';base64,'+d};return null}).filter(Boolean)})).filter(m=>m.content.length);
 const post=(eff,web)=>pfetch('https://api.openai.com/v1/responses',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+keyOf('openai')},body:JSON.stringify({model:rid,instructions:sysPrompt(),input,stream:true,store:false,...(eff?{reasoning:{effort:eff,summary:'auto'}}:{}),...(web?{tools:[{type:'web_search'}]}:{})})});
 let r=await post(em,S.set.web);
 if(r.status===400&&S.set.web)r=await post(em,false);
 if(r.status===400&&em!=='high')r=await post('high',false);
 if(r.status===400)r=await post('',false);
 if(!r.ok)throw new Error(await errText(r,rid,c));
 await readSSE(r,d=>{if(d==='[DONE]')return;let j;try{j=JSON.parse(d)}catch(_){return}const t=j.type||'';
  if(t==='response.output_text.delta'){ai.text+=j.delta||'';got(ai)}
  else if(t==='response.reasoning_summary_text.delta')ai.think=(ai.think||'')+(j.delta||'');
  else if(t==='response.reasoning_summary_part.added'&&ai.think)ai.think+='\n\n';
  else if(t==='response.output_text.annotation.added'&&j.annotation&&j.annotation.url){ai.src=ai.src||[];if(!ai.src.some(x=>x.u===j.annotation.url))ai.src.push({u:j.annotation.url,t:j.annotation.title||j.annotation.url})}
  else if(t==='response.completed'){const u=(j.response&&j.response.usage)||{};uin=u.input_tokens||0;uout=u.output_tokens||0}
  else if(t==='response.failed'||t==='error')throw new Error((j.response&&j.response.error&&j.response.error.message)||j.message||'OpenAI gagal')},draw);
 return{in:uin,out:uout}}
async function callAnthropic(ref,c,ai,hist,draw){let uin=0,uout=0;const rid=ref.m,bud={low:1024,medium:4096,high:10000,ultra:20000,max:32000}[S.set.effort]||4096,msgs=[];
 hist.forEach(h=>{const role=h.role==='model'?'assistant':'user',bl=h.parts.map(q=>{if(q.text!=null)return q.text.trim()?{type:'text',text:q.text}:null;const mt=q.inlineData.mimeType;
  if(/^image\//.test(mt))return{type:'image',source:{type:'base64',media_type:mt,data:q.inlineData.data}};if(mt==='application/pdf')return{type:'document',source:{type:'base64',media_type:mt,data:q.inlineData.data}};return null}).filter(Boolean);
  if(!bl.length)return;const l=msgs[msgs.length-1];if(l&&l.role===role)l.content=l.content.concat(bl);else msgs.push({role,content:bl})});
 const post=th=>pfetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':keyOf('anthropic'),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:rid,max_tokens:th?bud+8192:8192,system:sysPrompt(),messages:msgs,stream:true,...(th?{thinking:{type:'enabled',budget_tokens:bud}}:{})})});
 let r=await post(true);if(r.status===400)r=await post(false);
 if(!r.ok)throw new Error(await errText(r,rid,c));
 await readSSE(r,d=>{let j;try{j=JSON.parse(d)}catch(_){return}const t=j.type;
  if(t==='content_block_delta'&&j.delta){if(j.delta.type==='text_delta'){ai.text+=j.delta.text||'';got(ai)}else if(j.delta.type==='thinking_delta')ai.think=(ai.think||'')+(j.delta.thinking||'')}

 return{in:uin,out:uout}}
async function callChat(ref,c,ai,hist,draw){let uin=0,uout=0;const pv=ref.p,rid=ref.m,eff=S.set.effort;

 const msgs=[{role:'system',content:sysPrompt()}];
 hist.forEach(h=>{const role=h.role==='model'?'assistant':'user',tx=h.parts.filter(q=>q.text!=null).map(q=>q.text).join('\n'),
  imgs=(pv==='kimi'&&role==='user')?h.parts.filter(q=>q.inlineData&&/^image\//.test(q.inlineData.mimeType)):[],
  skip=h.parts.filter(q=>q.inlineData).length-imgs.length,text=tx+((skip&&role==='user')?'\n\n[Lampiran biner tidak didukung model ini dan diabaikan]':'');

 const extra=eff==='low'?{thinking:{type:'disabled'}}:(pv==='deepseek'?{thinking:{type:'enabled'},reasoning_effort:(eff==='ultra'||eff==='max')?'max':'high'}:{});

 let r=await post(extra);if(r.status===400&&Object.keys(extra).length)r=await post({});
 if(!r.ok)throw new Error(await errText(r,rid,c));
 await readSSE(r,d=>{if(d==='[DONE]')return;let j;try{j=JSON.parse(d)}catch(_){return}const ch=j.choices&&j.choices[0],dl=ch&&ch.delta;
  if(dl){if(dl.reasoning_content)ai.think=(ai.think||'')+dl.reasoning_content;if(dl.content){ai.text+=dl.content;got(ai)}}

 document.querySelectorAll('textarea.cat').forEach(t=>{const x=S.set.cat[+t.dataset.i];if(!x)return;const names=[];
  t.value.split(/\r?\n/).forEach(l=>{const q=l.split('='),n=q[0].trim();if(!n)return;names.push(n);const r=normRef(q.slice(1).join('=')),k=x.g+'|'+n;
   if(r){S.set.map[k]=r;if(!S.set.reals.includes(r))S.set.reals.push(r)}else delete S.set.map[k]});x.m=names});

const b64u=u=>{let t='';u.forEach(b=>t+=String.fromCharCode(b));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return Uint8Array.from(atob(t),c=>c.charCodeAt(0))};
async function pack(o){const raw=new TextEncoder().encode(JSON.stringify(o));
 if(window.CompressionStream){const st=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'));return 'z.'+b64u(new Uint8Array(await new Response(st).arrayBuffer()))}
 return 'p.'+b64u(raw)}
async function unpack(t){const k=t.slice(0,2);let u=unb64u(t.slice(2));
 if(k==='z.'){const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));u=new Uint8Array(await new Response(st).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(u))}
const shareObj=c=>({v:1,t:c.title,m:c.msgs.filter(m=>!m.err&&m.text).map(m=>[m.role==='user'?'u':'a',m.text,m.role==='model'?m.model:0,m.role==='model'&&m.src&&m.src.length?m.src.slice(0,6):0])});
const extract=x=>{const m=String(x).match(/share=([A-Za-z0-9_.\-]+)/);return m?m[1]:String(x).trim()};
const shareBase=()=>((S.set.shareBase||'').trim()||(/^https?:/.test(location.protocol)?location.origin+location.pathname:'https://multiai.vercel.app/chat/')).split('#')[0];
const shareOrigin=()=>{try{return new URL(shareBase()).origin}catch(_){return 'https://multiai.vercel.app'}};
async function resolveShare(x){x=String(x).trim();const m=x.match(/^(https?:\/\/[^\/\s#?]+)?\/s\/([A-Za-z0-9_-]{4,16})/);
 if(m){const r=await fetch((m[1]||shareOrigin())+'/api/share?id='+m[2]);if(!r.ok)throw new Error('x');return (await r.json()).d}
 return extract(x)}
function importShared(o){if(!o||!Array.isArray(o.m))throw new Error('x');
 const c={id:uid(),title:String(o.t||'Chat dibagikan').slice(0,60),t:Date.now(),model:S.set.model,msgs:o.m.map(x=>({role:x[0]==='u'?'user':'model',text:String(x[1]),model:x[2]||S.set.model,src:x[3]||undefined}))};
 S.chats.push(c);S.cur=c.id;save();renderAll()}
async function shareChat(c){if(!c.msgs.length){note('Chat ini masih kosong.');return}
 $('#dlg').innerHTML='<div class="dm">Membuat link…</div>';$('#dlgw').classList.add('on');
 const pl=await pack(shareObj(c));let link=shareBase()+'#share='+pl,short=false;
 try{const r=await fetch(shareOrigin()+'/api/share',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({d:pl})});if(r.ok){const j=await r.json();if(j.id){link=shareOrigin()+'/s/'+j.id;short=true}}}catch(_){}
 $('#dlg').innerHTML=`<div class="dm"><b>Bagikan chat</b><div class="note" style="margin-top:2px">${esc(c.title)}</div></div><textarea class="lk" readonly rows="4">${link}</textarea><p class="note">${short?'Link pendek ini tersimpan di server dan berlaku 30 hari. ':link.length>3500?'Link ini panjang ('+link.length+' karakter) dan bisa terpotong di aplikasi chat tertentu. ':''}Siapa pun yang punya link bisa membaca chat ini. API key dan memori tidak ikut terkirim.</p><div class="dbt"><button class="btn" data-k="c">Salin</button><button class="btn p" data-k="s">Bagikan</button></div>`;
 $('#dlgw').classList.add('on');
 $('#dlg').onclick=async e=>{const b=e.target.closest('button[data-k]');if(!b)return;
  if(b.dataset.k==='c'){await copy(link);b.textContent='Tersalin';setTimeout(()=>b.textContent='Salin',1200)}
  else if(window.Android&&window.Android.share)window.Android.share('Chat "'+c.title+'" dari MultiAI\n'+link);
  else if(navigator.share){try{await navigator.share({title:c.title,text:'Chat "'+c.title+'" dari MultiAI',url:link})}catch(_){}}
  else{await copy(link);b.textContent='Tersalin';setTimeout(()=>b.textContent='Bagikan',1200)}};
 $('#dlgw').onclick=e=>{if(e.target.id==='dlgw')$('#dlgw').classList.remove('on')}}
async function handleShare(x){let pl;try{pl=await resolveShare(x)}catch(_){note('Link chat tidak ditemukan atau sudah kedaluwarsa.');return}try{history.replaceState(null,'',/^\/s\//.test(location.pathname)?'/chat/':location.pathname)}catch(_){}
 try{const o=await unpack(pl);if(!o||!Array.isArray(o.m))throw 0;
  const pv=o.m.slice(0,3).map(m=>`<p><b>${m[0]==='u'?'Kamu':'AI'}:</b> ${esc(String(m[1]).slice(0,140))}</p>`).join('');
  $('#dlg').innerHTML=`<div class="dm"><b>${esc(o.t||'Chat dibagikan')}</b><div class="note" style="margin-top:2px">${o.m.length} pesan dibagikan kepadamu</div></div><div class="pvw">${pv}</div><div class="dbt"><button class="btn" data-k="n">Batal</button><button class="btn p" data-k="y">Buka chat</button></div>`;
  $('#dlgw').classList.add('on');
  $('#dlg').onclick=e=>{const b=e.target.closest('button[data-k]');if(!b)return;$('#dlgw').classList.remove('on');if(b.dataset.k==='y'){$('#modal').classList.remove('on');importShared(o)}};
  $('#dlgw').onclick=e=>{if(e.target.id==='dlgw')$('#dlgw').classList.remove('on')}}
 catch(e){note('Link chat tidak valid atau rusak.')}}
window.openShared=x=>handleShare(x);
/* ---------- akun (Supabase) ---------- */
const CFG_OK=typeof SUPABASE_URL==='string'&&typeof SUPABASE_KEY==='string'&&!/ISI_/.test(SUPABASE_URL+SUPABASE_KEY);
let user=null,sb=null,sv=S.sv||0,syncT=null,applying=false,amode='in';
if(CFG_OK&&window.supabase){try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){sb=null}}
const syncData=()=>JSON.parse(JSON.stringify({chats:S.chats,cur:S.cur,set:S.set,use:S.use,mems:S.mems},(k,v)=>(k==='b64'||(k==='data'&&typeof v==='string'))?undefined:v));
function queuePush(){if(!user||applying)return;clearTimeout(syncT);syncT=setTimeout(()=>{syncT=null;pushSync()},1500)}
async function pushNow(){if(syncT){clearTimeout(syncT);syncT=null}await pushSync()}
async function pushSync(){if(!sb||!user||applying)return;
 const row={data:syncData(),version:sv+1,updated_at:new Date().toISOString()};
 try{if(sv===0){const r=await sb.from('user_state').insert(Object.assign({user_id:user.id},row));if(r.error){await pullSync(true);return}}
  else{const r=await sb.from('user_state').update(row).eq('user_id',user.id).eq('version',sv).select('version');if(r.error||!r.data||!r.data.length){await pullSync(true);return}}
  sv=sv+1;S.sv=sv;S.syncUid=user.id;persist()}catch(e){}}
function applyRemote(d,union){applying=true;const lc=S.chats||[],lm=S.mems||[],lk=S.set.key;
 let chats=d.chats||[],mems=d.mems||[];
 if(union){const ci=new Set(chats.map(c=>c.id)),mi=new Set(mems.map(m=>m.id));chats=chats.concat(lc.filter(c=>!ci.has(c.id)));mems=mems.concat(lm.filter(m=>!mi.has(m.id)))}
 else mems=mems.concat(lm.filter(m=>m.b64));
 S.chats=chats;S.mems=mems;S.cur=chats.some(c=>c.id===d.cur)?d.cur:(chats.some(c=>c.id===S.cur)?S.cur:null);
 S.set=Object.assign({},S.set,d.set||{});if(!S.set.key&&lk)S.set.key=lk;S.use=d.use||S.use;applying=false}
async function pullSync(merge){if(!sb||!user||(syncT&&!merge)||busy)return;
 try{const r=await sb.from('user_state').select('data,version').eq('user_id',user.id).maybeSingle();if(r.error)return;
  if(!r.data){sv=0;await pushSync();return}
  const first=!!merge||S.syncUid!==user.id;if(!first&&r.data.version===sv)return;
  applyRemote(r.data.data||{},first);sv=r.data.version;S.sv=sv;S.syncUid=user.id;persist();applyTheme();renderAll();
  if(first)queuePush()}catch(e){}}
async function logout(){if(!await confirmD('Keluar dari akun?'))return;
 try{await pushNow()}catch(_){}try{await sb.auth.signOut()}catch(_){}try{localStorage.removeItem('chatbotai')}catch(_){}location.href='/chat/'}
function updAcct(){$('#acct').innerHTML=user?`<div class="ac"><span>${esc(user.email||'')}</span><button id="outb">Keluar</button></div>`:'<button class="btn p" id="inb">Masuk</button>';
 const o=$('#outb');if(o)o.onclick=logout;const i=$('#inb');if(i)i.onclick=openAuth;
 $('#inp').placeholder=user?'Tulis pesan…':'Masuk untuk mulai chat…'}
function setAuthMode(m){amode=m;document.querySelectorAll('#authTabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 $('#authT').textContent=m==='in'?'Masuk ke MultiAI':'Buat akun MultiAI';$('#ago').textContent=m==='in'?'Masuk':'Daftar';
 $('#apw').autocomplete=m==='in'?'current-password':'new-password';aerr('')}
function aerr(t,ok){const e=$('#aerr');e.textContent=t;e.style.color=ok?'var(--tx)':'var(--err)'}
function openAuth(){$('#authm').classList.add('on');setAuthMode(amode)}
const aMsg=m=>/invalid login/i.test(m)?'Email atau password salah.':/already registered|already been registered/i.test(m)?'Email sudah terdaftar. Silakan masuk.':/not confirmed/i.test(m)?'Email belum dikonfirmasi. Cek kotak masuk emailmu.':/rate limit|too many/i.test(m)?'Terlalu banyak percobaan. Coba lagi beberapa saat.':/password/i.test(m)?'Password minimal 6 karakter.':'Gagal: '+m;
async function doAuth(){const em=$('#aem').value.trim(),pw=$('#apw').value;
 if(!sb)return aerr(CFG_OK?'Layanan login tidak bisa dimuat. Periksa koneksi internet.':'Login belum dikonfigurasi. Isi SUPABASE_URL dan SUPABASE_KEY di chat/config.js.');
 if(!/^\S+@\S+\.\S+$/.test(em))return aerr('Email tidak valid.');
 if(pw.length<6)return aerr('Password minimal 6 karakter.');
 const b=$('#ago');b.disabled=true;aerr('');
 try{const r=amode==='in'?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});
  if(r.error)aerr(aMsg(r.error.message));
  else if(amode==='up'&&!(r.data&&r.data.session)){setAuthMode('in');aerr('Akun dibuat. Cek emailmu untuk konfirmasi, lalu masuk.',1)}
  else{$('#authm').classList.remove('on');$('#apw').value=''}}
 catch(e){aerr('Gagal terhubung. Coba lagi.')}
 b.disabled=false}
$('#authTabs').onclick=e=>{const b=e.target.closest('button');if(b)setAuthMode(b.dataset.m)};
$('#aclose').onclick=()=>$('#authm').classList.remove('on');
$('#ago').onclick=doAuth;$('#apw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth()});$('#aem').addEventListener('keydown',e=>{if(e.key==='Enter')$('#apw').focus()});
if(sb){sb.auth.onAuthStateChange((ev,ss)=>{const nu=(ss&&ss.user)||null,was=user;user=nu;updAcct();if(nu&&(!was||was.id!==nu.id)){$('#authm').classList.remove('on');setTimeout(pullSync,0)}});
 sb.auth.getSession().then(r=>{if(!(r.data&&r.data.session)&&/[?&]masuk/.test(location.search)){openAuth();try{history.replaceState(null,'',location.pathname)}catch(_){}}})}
else if(/[?&]masuk/.test(location.search))setTimeout(openAuth,0);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullSync()});
updAcct();
/* ---------- layar penuh preview + geser sidebar ---------- */
function togFull(on){const p=$('#panel');on=on===undefined?!p.classList.contains('full'):on;
 p.classList.toggle('full',on);$('#pfull').innerHTML=ic(on?'shrink':'expand',16);$('#pfull').title=on?'Keluar layar penuh':'Layar penuh';
 try{if(on&&p.requestFullscreen&&!document.fullscreenElement)p.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(_){}
 setTimeout(()=>{if(pf&&pf.lang==='pdf'&&pmode==='p'&&p.classList.contains('on'))pdfPreview(pf,$('#pb'))},300)}
$('#pfull').onclick=()=>togFull();
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&$('#panel').classList.contains('full'))togFull(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#panel').classList.contains('full'))togFull(false)});
const swipeOpen=(open,dx,dt,W)=>{const pos=Math.max(-W,Math.min(0,(open?0:-W)+dx)),v=dx/Math.max(dt,1);return v>.5?true:v<-.5?false:pos>-W*.5};
(function(){const side=$('#side'),mq=matchMedia('(max-width:820px)');let t=null;
 const W=()=>side.offsetWidth||290;
 const hscroll=el=>{while(el&&el!==document.body){if(el.scrollWidth>el.clientWidth+2){const o=getComputedStyle(el).overflowX;if(o==='auto'||o==='scroll')return true}el=el.parentElement}return false};
 const shade=pos=>'0 0 0 100vmax rgba(0,0,0,'+(.55*(1+pos/W())).toFixed(2)+')';
 document.addEventListener('touchstart',e=>{t=null;if(!mq.matches||e.touches.length!==1)return;const p=e.touches[0],open=side.classList.contains('on');
  if(!open&&(p.clientX>innerWidth*.55||hscroll(e.target)||e.target.closest('input,textarea,iframe,#panel,.modal,.ov')))return;
  t={x:p.clientX,y:p.clientY,t0:Date.now(),open,drag:false,dx:0}},{passive:true});
 document.addEventListener('touchmove',e=>{if(!t)return;const p=e.touches[0],dx=p.clientX-t.x,dy=p.clientY-t.y;
  if(!t.drag){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){t=null;return}
   if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5&&((!t.open&&dx>0)||(t.open&&dx<0))){t.drag=true;side.style.transition='none'}else return}
  t.dx=dx;const pos=Math.max(-W(),Math.min(0,(t.open?0:-W())+dx));side.style.transform='translateX('+pos+'px)';side.style.boxShadow=shade(pos)},{passive:true});
 document.addEventListener('touchend',()=>{if(!t||!t.drag){t=null;return}
  const open=swipeOpen(t.open,t.dx,Date.now()-t.t0,W());t=null;side.style.transition='';
  requestAnimationFrame(()=>{side.style.transform='';side.style.boxShadow='';side.classList.toggle('on',open)})},{passive:true});
 document.addEventListener('click',e=>{if(mq.matches&&side.classList.contains('on')&&!e.target.closest('#side,#menu')){e.stopPropagation();e.preventDefault();side.classList.remove('on')}},true)})();
const wb=$('#webb'),syncWeb=()=>wb.classList.toggle('on',!!S.set.web);
wb.onclick=()=>{S.set.web=!S.set.web;save();syncWeb()};syncWeb();
$('#msave').addEventListener('click',()=>renderAll());
renderAll();
if(/share=/.test(location.hash))handleShare(location.hash);
else if(/^\/s\/[A-Za-z0-9_-]{4,16}$/.test(location.pathname))handleShare(location.pathname);
addEventListener('hashchange',()=>{if(/share=/.test(location.hash))handleShare(location.hash)});
