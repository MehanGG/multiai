<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('chatbotai')).set.theme==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<title>MultiAI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%201024%201024%22%3E%3Crect%20width%3D%221024%22%20height%3D%221024%22%20rx%3D%22220%22%20fill%3D%22%23000%22/%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2256%22%3E%3Cg%20transform%3D%22translate%28512%20512%29%20scale%28.8%29%22%3E%3Cellipse%20rx%3D%22490%22%20ry%3D%2268%22/%3E%3Cellipse%20rx%3D%22435%22%20ry%3D%2262%22%20transform%3D%22rotate%2890%29%22/%3E%3Cellipse%20rx%3D%22445%22%20ry%3D%2262%22%20transform%3D%22rotate%28-46%29%22/%3E%3Cellipse%20rx%3D%22375%22%20ry%3D%2262%22%20transform%3D%22rotate%2852%29%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<style>
/* MultiAI — tinta & kertas. Satu aksen (biru kobalt), bentuk tegas, tipografi Bricolage + Figtree. */
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap');
:root,[data-theme=dark]{--bg:#0e0f12;--panel:#15171b;--panel2:#1d2025;--line:#272a31;--tx:#e9e7e2;--mut:#898d96;--ac:#3b6cff;--al:#8aa6ff;--ac2:#8aa6ff;--err:#ff7a70;--cbg:#0a0b0d;--ov:rgba(4,5,8,.62);--r:6px;--rl:12px;color-scheme:dark}
[data-theme=light]{--bg:#f3f1ec;--panel:#fbfaf7;--panel2:#e9e6df;--line:#d9d5cb;--tx:#1b1c1f;--mut:#6c6f76;--ac:#1f4fe0;--al:#1f4fe0;--ac2:#1f4fe0;--err:#c8321f;--cbg:#ece9e1;--ov:rgba(27,28,31,.4);--r:6px;--rl:12px;color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}*:focus{outline:none}
*:focus-visible{outline:2px solid var(--al)!important;outline-offset:2px}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.6 Figtree,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;display:flex;overflow:hidden;height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}button:active{opacity:.6}
.i{display:inline-flex}.ic{flex-shrink:0}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}::-webkit-scrollbar-track{background:transparent}

/* sidebar */
#side{width:268px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;font:700 19px/1 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em}
.logo{width:28px;height:28px;border-radius:7px;background:#000;display:grid;place-items:center;padding:4px;flex-shrink:0}.logo svg{width:100%;height:100%;stroke:#fff;fill:none;stroke-width:56}
.logo.big{width:56px;height:56px;border-radius:14px;padding:8px;margin:0 0 22px}.logo.big svg{stroke-width:32}
.newb{margin:10px 14px 8px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--tx);color:var(--tx);font-weight:600;justify-content:flex-start;transition:background .15s,color .15s}
.newb:hover{background:var(--tx);color:var(--bg)}
#list{flex:1;overflow:auto;padding:4px 10px}
.ci{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--r);cursor:pointer;color:var(--mut);border-left:2px solid transparent}
.ci:hover{background:var(--panel2);color:var(--tx)}.ci.on{color:var(--tx);border-left-color:var(--ac);background:var(--panel2);border-radius:0 var(--r) var(--r) 0}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci button{opacity:0;color:var(--mut);padding:4px;border-radius:5px}.ci:hover button,.ci.on button{opacity:1}.ci button:hover{color:var(--tx)}.ci .pn{color:var(--al);display:inline-flex;flex:0}
.gh{padding:12px 10px 4px;font-size:12px;color:var(--mut);font-weight:600}
.sfoot{display:flex;gap:4px;padding:10px 14px;border-top:1px solid var(--line)}
.sfoot button{padding:8px 10px;border-radius:var(--r);color:var(--mut)}.sfoot button:hover{background:var(--panel2);color:var(--tx)}.sfoot #setb{flex:1}

/* header */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:8px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
.hb{display:none;padding:6px;margin-left:-6px}.mp{position:relative}header .mp:last-child{margin-left:auto}
#mbtn,#ebtn{padding:6px 10px;border-radius:var(--r);font-weight:600;white-space:nowrap;color:var(--tx)}
#mbtn:hover,#ebtn:hover{background:var(--panel2)}
#mbtn{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-size:16px;letter-spacing:-.01em}
#ebtn{color:var(--al);font-size:13px}
#mmenu,#emenu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:310px;max-width:86vw;max-height:62vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:6px;display:none;box-shadow:0 18px 40px var(--ov)}
#emenu{width:220px;left:auto;right:0}#mmenu.on,#emenu.on{display:block}
#mmenu button,#emenu button{display:flex;width:100%;text-align:left;padding:9px 11px;border-radius:var(--r)}#emenu button{flex-direction:column;align-items:flex-start;gap:0}
#mmenu button:hover,#emenu button:hover{background:var(--panel2)}#mmenu button.on,#emenu button.on{color:var(--al);background:var(--panel2)}
#emenu small{color:var(--mut);font-size:12px}

/* chat */
#msgs{flex:1;overflow:auto;padding:28px 18px}.wrap{max-width:740px;margin:auto}
.empty{margin-top:12vh;text-align:left;max-width:560px}
.empty h1{font:700 clamp(28px,5vw,40px)/1.1 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.03em;margin-bottom:10px}
.empty p{color:var(--mut);max-width:44ch}
.chips{display:flex;flex-direction:column;align-items:flex-start;gap:0;margin-top:28px;border-top:1px solid var(--line);width:100%}
.chips button{width:100%;padding:13px 2px;border-bottom:1px solid var(--line);color:var(--tx);text-align:left;justify-content:space-between;border-radius:0}
.chips button::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--mut);border-top:1.5px solid var(--mut);transform:rotate(45deg);margin-right:4px;transition:transform .15s,border-color .15s}
.chips button:hover{color:var(--al)}.chips button:hover::after{border-color:var(--al);transform:translateX(3px) rotate(45deg)}
.msg{margin-bottom:26px;display:flex}.av{display:none}.bd{min-width:0;max-width:100%;flex:1}
.msg.user{justify-content:flex-end}
.msg.user .bd{flex:0 1 auto;max-width:84%;background:var(--ac);color:#fff;padding:9px 14px;border-radius:var(--rl) var(--rl) 3px var(--rl)}
.msg.user .bd a{color:#fff}.msg.user .at{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.who{font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:600}.msg.user .who{display:none}
.msg.ai .bd{padding-left:14px;border-left:2px solid var(--line)}
.bd p{margin:0 0 11px;overflow-wrap:anywhere}.bd h3,.bd h4{margin:18px 0 6px;font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.01em}.bd ul,.bd ol{margin:0 0 11px 22px}.bd li{margin-bottom:3px}.bd a{color:var(--al)}
.bd code.i{background:var(--panel2);padding:1px 6px;border-radius:4px;font:12.5px ui-monospace,Menlo,Consolas,monospace}
.cb{border:1px solid var(--line);border-radius:var(--r);background:var(--cbg);margin:12px 0;overflow:hidden}
.ch{display:flex;align-items:center;gap:4px;padding:5px 8px 5px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}.ch b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch button{padding:3px 9px;border-radius:5px}.ch button:hover{background:var(--panel2);color:var(--tx)}
.cb pre{padding:12px;overflow:auto;max-height:340px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;tab-size:2}
.fc{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:9px;margin:12px 0;cursor:pointer;max-width:420px}.fc:hover{border-color:var(--mut)}
.fi{width:40px;height:44px;border-radius:5px;display:grid;place-items:center;font:700 11px Figtree,sans-serif;flex-shrink:0;color:#fff}
.fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fs{font-size:12px;color:var(--mut)}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.at{padding:2px 9px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--mut)}a.at{text-decoration:none}a.at:hover{color:var(--tx)}
.bd a.yt{display:flex;gap:10px;align-items:center;max-width:380px;margin:6px 0;padding:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--tx);text-decoration:none}.yt img{width:112px;aspect-ratio:16/9;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--panel2)}.yt span{min-width:0;font-weight:500;overflow-wrap:anywhere}.yt small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.err{color:var(--err)}.dots::after{content:"";animation:d 1s steps(4) infinite}@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.th{margin:2px 0 12px;border-left:2px solid var(--line);padding-left:2px}
.th summary{cursor:pointer;padding:4px 10px;color:var(--mut);font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}.th summary::-webkit-details-marker{display:none}
.th summary::after{content:"";margin-left:6px;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:transform .15s}.th[open]>summary::after{transform:rotate(-135deg)}
.th ol{list-style:none;margin:0;padding:2px 10px 8px;max-height:240px;overflow:auto}
.th li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);padding:3px 0;min-width:0}.th li span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.th li .spin{width:14px;height:14px;color:var(--al)}.spin.st{animation:none}
.act{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap;margin-left:-8px}.act button{padding:3px 8px;border-radius:5px;color:var(--mut);font-size:12.5px}.act button:hover{background:var(--panel2);color:var(--tx)}
.msg.user .act{margin-left:0;justify-content:flex-end}.msg.user .act button{color:rgba(255,255,255,.75)}.msg.user .act button:hover{background:rgba(255,255,255,.16);color:#fff}
#webb{display:none!important}

/* composer */
.comp{padding:8px 18px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--bg)}
.box{max-width:740px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:8px;transition:border-color .15s}
.box:focus-within{border-color:var(--ac)}
#pf{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px}#pf:not(:empty){margin-bottom:6px}#pf .at button{margin-left:6px;color:var(--err)}
.row{display:flex;align-items:flex-end;gap:6px}
textarea{flex:1;background:none;border:0;color:var(--tx);font:inherit;resize:none;max-height:200px;padding:7px 6px}textarea::placeholder{color:var(--mut)}
textarea:focus-visible{outline:none!important}
.ib{height:36px;min-width:36px;border-radius:var(--r);color:var(--mut);justify-content:center;padding:0 8px;flex-shrink:0}.ib:hover{background:var(--panel2);color:var(--tx)}
#webb b{font-size:13px;font-weight:500}.ib.on{color:var(--al);background:var(--panel2)}
#send{background:var(--ac);color:#fff;padding:0;border-radius:var(--r)}#send:hover{background:var(--ac);filter:brightness(1.12);color:#fff}
.hint{text-align:center;font-size:12px;color:var(--mut);margin-top:7px}

/* panel preview */
#panel{width:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transition:width .25s;flex-shrink:0}#panel.on{width:min(48vw,640px)}
.ph{display:flex;align-items:center;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.ph b{flex:1;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ph button{padding:5px 9px;border-radius:5px;color:var(--mut);font-size:13px}.ph button:hover,.ph button.on{background:var(--panel2);color:var(--tx)}
#pb{flex:1;min-height:0;position:relative}#pb iframe{width:100%;height:100%;border:0;background:#fff}
#pb pre{position:absolute;inset:0;overflow:auto;padding:14px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--cbg);color:var(--tx)}
#panel.full{position:fixed;inset:0;width:100%!important;z-index:45;border-left:0}
.imgv{position:absolute;inset:0;display:grid;place-items:center;background:var(--cbg);padding:12px;overflow:auto}.imgv img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;background:repeating-conic-gradient(#8884 0 25%,transparent 0 50%) 50%/16px 16px}
.pdfh{position:absolute;inset:0;overflow:auto;background:#525659;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}.pdfh canvas{background:#fff;box-shadow:0 2px 10px #0006;max-width:100%}
.spin{display:inline-flex;vertical-align:middle;width:20px;height:20px;color:var(--tx);animation:rot 1.6s linear infinite;flex-shrink:0}.spin svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:64}@keyframes rot{to{transform:rotate(360deg)}}
.live .spin{width:16px;height:16px;margin-right:7px;color:var(--al)}.th summary .spin{width:16px;height:16px;color:var(--al)}.pl{display:grid;place-items:center;min-height:120px;padding:20px;color:var(--mut)}.pl .spin{width:34px;height:34px}.uo .spin{width:18px;height:18px}
.gd{width:7px;height:7px;border-radius:50%;background:var(--ac);flex-shrink:0;animation:pl 1s infinite alternate}@keyframes pl{from{opacity:.25}to{opacity:1}}.idle{color:var(--err)}
.live{font-size:12px;color:var(--mut);margin-bottom:6px;font-variant-numeric:tabular-nums}.live b{color:var(--al);font-weight:600}.meta{font-size:12px;color:var(--mut);margin-top:6px;font-variant-numeric:tabular-nums}

/* pengaturan */
.modal{position:fixed;inset:0;background:var(--ov);display:none;place-items:center;z-index:50;padding:16px}.modal.on{display:grid;grid-template-columns:minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);width:min(580px,100%);max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;justify-self:center;overflow:hidden;box-shadow:0 24px 60px var(--ov)}
.card h2{font:700 22px/1.1 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em;padding:20px 22px 12px;flex-shrink:0}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 12px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;margin-bottom:-1px;font-weight:500}.tabs button.on{color:var(--tx);border-color:var(--ac);font-weight:600}
.cbody{padding:18px 22px;overflow:auto;min-height:0;flex:1}.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 22px;border-top:1px solid var(--line);flex-shrink:0}
.sh{font-size:13px;font-weight:600;color:var(--tx);margin:28px 0 10px;padding-top:16px;border-top:1px solid var(--line)}.cbody>.sh:first-child{margin-top:0;padding-top:0;border-top:0}
label{display:block;font-size:13px;color:var(--mut);margin:16px 0 6px}.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--tx);font-size:14px}
input[type=text],input[type=password],.cbody textarea,.ed{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:var(--r);padding:9px 11px;font:inherit}
input[type=text]:focus,input[type=password]:focus,.cbody textarea:focus,.ed:focus{border-color:var(--ac)}
.cbody textarea{min-height:90px;display:block}.ed{min-height:80px;display:block;background:rgba(0,0,0,.18);color:inherit;border-color:rgba(255,255,255,.3)}
.sel{width:100%;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);text-align:left}.sel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px}.seg button{flex:1;justify-content:center;padding:7px;border-radius:4px;color:var(--mut)}.seg button.on{background:var(--tx);color:var(--bg);font-weight:600}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
input[type=checkbox]:checked{background:var(--ac)}input[type=checkbox]:checked::after{transform:translateX(16px)}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--line);width:100%;margin:10px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ac);border:3px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ac);border:3px solid var(--panel)}
.btn{padding:8px 14px;border-radius:var(--r);background:transparent;border:1px solid var(--line);justify-content:center;font-weight:500}.btn:hover{border-color:var(--mut)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.btn.d{color:var(--err)}.btn.d:hover{border-color:var(--err)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{padding:14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.stat:nth-child(2n){border-right:0}.stat:nth-last-child(-n+2){border-bottom:0}
.stat b{display:block;font:700 24px/1.1 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.stat span{font-size:12.5px;color:var(--mut)}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
.qc{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:8px}.qc b{font:700 30px/1.1 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em;display:block;font-variant-numeric:tabular-nums}.qc small{color:var(--mut);display:block}
.qr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.qr:last-child{border-bottom:0}.qr span:first-child{color:var(--mut)}.qr span:last-child{text-align:right;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}.note{font-size:12.5px;color:var(--mut);margin-top:6px}
.mi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.mi span{flex:1;min-width:0;overflow:hidden;word-break:break-word}.mi small{display:block;color:var(--mut);font-size:11.5px}.mi button{color:var(--mut);padding:4px}
.lk{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--mut);border-radius:var(--r);padding:8px;font:12px ui-monospace,Menlo,monospace;word-break:break-all;resize:none;display:block;margin-top:10px}
.pvw{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:13px;color:var(--mut);max-height:160px;overflow:auto;margin-top:10px}.pvw p{margin:0 0 6px}

let S={chats:[],cur:null,set:{key:'',model:'gemini-2.5-flash',temp:0.7,ctx:20,mem:''},use:{req:0,inp:0,out:0,by:{}}};

const EXT={png:'png',jpg:'jpg',webp:'webp',zip:'zip',mcpack:'mcpack',mcaddon:'mcaddon',mcworld:'mcworld',mctemplate:'mctemplate',pptx:'pptx',pdf:'pdf',docx:'docx',xlsx:'xlsx',csv:'csv',txt:'txt',text:'txt',html:'html',javascript:'js',js:'js',typescript:'ts',ts:'ts',python:'py',py:'py',css:'css',json:'json',java:'java',cpp:'cpp',c:'c',php:'php',bash:'sh',sh:'sh',sql:'sql',svg:'svg',markdown:'md',md:'md',jsx:'jsx',tsx:'tsx',go:'go',rust:'rs',xml:'xml',yaml:'yml'};
const YTID=u=>{const m=u.match(/(?:youtube\.com\/watch\?(?:[^"\s]*&amp;)?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/);return m&&m[1]};
function lnk(u,t){const id=YTID(u);
 if(id)return `<a class="yt" href="${u}" target="_blank" rel="noopener"><img loading="lazy" src="https://img.youtube.com/vi/${id}/mqdefault.jpg" alt=""><span>${t}<small>YouTube</small></span></a>`;
 return `<a href="${u}" target="_blank" rel="noopener">${t}</a>`}
function inl(s){const L=[],ph=(h)=>'\u0001'+(L.push(h)-1)+'\u0001';
 let t=esc(s).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,(_,a,u)=>ph(lnk(u,a)))
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;!?])/g,(_,p,u)=>p+ph(lnk(u,u.replace(/^https?:\/\//,'').slice(0,60))));
 t=t.replace(/`([^`]+)`/g,'<code class="i">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
 return t.replace(/\u0001(\d+)\u0001/g,(_,i)=>L[+i])}
function blocks(t){let o='',list=null,para=[];
 const fp=()=>{if(para.length){o+='<p>'+para.join('<br>')+'</p>';para=[]}},fl=()=>{if(list){o+=`<${list.t}>${list.i.join('')}</${list.t}>`;list=null}};
 for(const ln of t.split('\n')){let m;
  if(m=ln.match(/^(#{1,4})\s+(.*)/)){fp();fl();o+=`<h${m[1].length<3?3:4}>${inl(m[2])}</h${m[1].length<3?3:4}>`}

 fp();fl();return o}

 for(const l of t.split('\n')){
  if(code===null){const m=l.match(/^\s{0,3}(`{3,})\s*([^`]*)$/);
   if(m){if(buf.length)out.push({t:'x',s:buf.join('\n')});buf=[];code={n:m[1].length,head:m[2].trim(),lines:[]}}
   else{const m2=l.match(/^(.*\S)\s*(`{3,})([\w+#.-]+(?:\s+[\w.-]+)?)\s*$/);

 if(sg.t==='c'){const head=sg.head.split(/\s+/).filter(Boolean),code=sg.code;

async function streamOnce(body,ai,draw,noThink){const g=draw.g;

  if(j.error)throw httpErr(j.error.status||500,typeof j.error==='string'?j.error:(j.error.message||'gagal'));

   if(dl.content)feed(typeof dl.content==='string'?dl.content:(Array.isArray(dl.content)?dl.content.map(x=>x.text||'').join(''):''))}

  if(j.usage){const u=j.usage;out.in=u.prompt_tokens||u.input_tokens||out.in;out.out=u.completion_tokens||u.output_tokens||out.out}};

 $('#dlgw').onclick=e=>{if(e.target.id==='dlgw')fin(o.input?null:false)}})}
const note=m=>dlg({msg:m}),confirmD=m=>dlg({msg:m,cancel:1,ok:'Ya'}),promptD=(m,ph,val,ok)=>dlg({msg:m,input:1,cancel:1,ph,val,ok:ok||'Tambah'});
document.querySelectorAll('[data-ic]').forEach(e=>{e.innerHTML=ic(e.dataset.ic,+e.dataset.s||18)});
$('#send').innerHTML=ic('arrow',18);applyTheme();$('#thb').onclick=()=>setTheme(themeOf()==='dark'?'light':'dark');
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="http"]');if(a&&window.Android&&window.Android.openUrl){e.preventDefault();window.Android.openUrl(a.href)}});
/* ---------- bagikan chat ---------- */
const b64u=u=>{let t='';u.forEach(b=>t+=String.fromCharCode(b));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return Uint8Array.from(atob(t),c=>c.charCodeAt(0))};
async function pack(o){const raw=new TextEncoder().encode(JSON.stringify(o));
 if(window.CompressionStream){const st=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'));return 'z.'+b64u(new Uint8Array(await new Response(st).arrayBuffer()))}
 return 'p.'+b64u(raw)}
async function unpack(t){const k=t.slice(0,2);let u=unb64u(t.slice(2));
 if(k==='z.'){const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));u=new Uint8Array(await new Response(st).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(u))}
const shareObj=c=>({v:1,t:c.title,m:c.msgs.filter(m=>!m.err&&m.text).map(m=>[m.role==='user'?'u':'a',m.text,m.role==='model'?m.model:0,m.role==='model'&&m.src&&m.src.length?m.src.slice(0,6):0])});
const extract=x=>{const m=String(x).match(/share=([A-Za-z0-9_.\-]+)/);return m?m[1]:String(x).trim()};
const shareBase=()=>((S.set.shareBase||'').trim()||(/^https?:/.test(location.protocol)?location.origin+location.pathname:'https://multiai.vercel.app/chat/')).split('#')[0];
const shareOrigin=()=>{try{return new URL(shareBase()).origin}catch(_){return 'https://multiai.vercel.app'}};
async function resolveShare(x){x=String(x).trim();const m=x.match(/^(https?:\/\/[^\/\s#?]+)?\/s\/([A-Za-z0-9_-]{4,16})/);
 if(m){const r=await fetch((m[1]||shareOrigin())+'/api/share?id='+m[2]);if(!r.ok)throw new Error('x');return (await r.json()).d}
 return extract(x)}
function importShared(o){if(!o||!Array.isArray(o.m))throw new Error('x');
 const c={id:uid(),title:String(o.t||'Chat dibagikan').slice(0,60),t:Date.now(),model:S.set.model,msgs:o.m.map(x=>({role:x[0]==='u'?'user':'model',text:String(x[1]),model:x[2]||S.set.model,src:x[3]||undefined}))};
 S.chats.push(c);S.cur=c.id;save();renderAll()}
async function shareChat(c){if(!c.msgs.length){note('Chat ini masih kosong.');return}
 $('#dlg').innerHTML='<div class="dm">'+spin()+'</div>';$('#dlgw').classList.add('on');
 const pl=await pack(shareObj(c));let link=shareBase()+'#share='+pl,short=false;
 try{const r=await fetch(shareOrigin()+'/api/share',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({d:pl})});if(r.ok){const j=await r.json();if(j.id){link=shareOrigin()+'/s/'+j.id;short=true}}}catch(_){}
 $('#dlg').innerHTML=`<div class="dm"><b>Bagikan chat</b><div class="note" style="margin-top:2px">${esc(c.title)}</div></div><textarea class="lk" readonly rows="4">${link}</textarea><p class="note">${short?'Link pendek ini tersimpan di server dan berlaku 30 hari. ':link.length>3500?'Link ini panjang ('+link.length+' karakter) dan bisa terpotong di aplikasi chat tertentu. ':''}Siapa pun yang punya link bisa membaca chat ini. API key dan memori tidak ikut terkirim.</p><div class="dbt"><button class="btn" data-k="c">Salin</button><button class="btn p" data-k="s">Bagikan</button></div>`;
 $('#dlgw').classList.add('on');
 $('#dlg').onclick=async e=>{const b=e.target.closest('button[data-k]');if(!b)return;
  if(b.dataset.k==='c'){await copy(link);b.textContent='Tersalin';setTimeout(()=>b.textContent='Salin',1200)}
  else if(window.Android&&window.Android.share)window.Android.share('Chat "'+c.title+'" dari MultiAI\n'+link);
  else if(navigator.share){try{await navigator.share({title:c.title,text:'Chat "'+c.title+'" dari MultiAI',url:link})}catch(_){}}
  else{await copy(link);b.textContent='Tersalin';setTimeout(()=>b.textContent='Bagikan',1200)}};
 $('#dlgw').onclick=e=>{if(e.target.id==='dlgw')$('#dlgw').classList.remove('on')}}
async function handleShare(x){let pl;try{pl=await resolveShare(x)}catch(_){note('Link chat tidak ditemukan atau sudah kedaluwarsa.');return}try{history.replaceState(null,'',/^\/s\//.test(location.pathname)?'/chat/':location.pathname)}catch(_){}
 try{const o=await unpack(pl);if(!o||!Array.isArray(o.m))throw 0;
  const pv=o.m.slice(0,3).map(m=>`<p><b>${m[0]==='u'?'Kamu':'AI'}:</b> ${esc(String(m[1]).slice(0,140))}</p>`).join('');
  $('#dlg').innerHTML=`<div class="dm"><b>${esc(o.t||'Chat dibagikan')}</b><div class="note" style="margin-top:2px">${o.m.length} pesan dibagikan kepadamu</div></div><div class="pvw">${pv}</div><div class="dbt"><button class="btn" data-k="n">Batal</button><button class="btn p" data-k="y">Buka chat</button></div>`;
  $('#dlgw').classList.add('on');
  $('#dlg').onclick=e=>{const b=e.target.closest('button[data-k]');if(!b)return;$('#dlgw').classList.remove('on');if(b.dataset.k==='y'){$('#modal').classList.remove('on');importShared(o)}};
  $('#dlgw').onclick=e=>{if(e.target.id==='dlgw')$('#dlgw').classList.remove('on')}}
 catch(e){note('Link chat tidak valid atau rusak.')}}
window.openShared=x=>handleShare(x);
/* ---------- akun (Supabase) ---------- */
const CFG_OK=typeof SUPABASE_URL==='string'&&typeof SUPABASE_KEY==='string'&&!/ISI_/.test(SUPABASE_URL+SUPABASE_KEY);
let user=null,sb=null,sv=S.sv||0,syncT=null,applying=false,amode='in';
if(CFG_OK&&window.supabase){try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){sb=null}}
const syncData=()=>JSON.parse(JSON.stringify({chats:S.chats,cur:S.cur,set:S.set,use:S.use,mems:S.mems},(k,v)=>(k==='b64'||(k==='data'&&typeof v==='string'))?undefined:v));
function queuePush(){if(!user||applying)return;clearTimeout(syncT);syncT=setTimeout(()=>{syncT=null;pushSync()},1500)}
async function pushNow(){if(syncT){clearTimeout(syncT);syncT=null}await pushSync()}
async function pushSync(){if(!sb||!user||applying)return;
 const row={data:syncData(),version:sv+1,updated_at:new Date().toISOString()};
 try{if(sv===0){const r=await sb.from('user_state').insert(Object.assign({user_id:user.id},row));if(r.error){await pullSync(true);return}}
  else{const r=await sb.from('user_state').update(row).eq('user_id',user.id).eq('version',sv).select('version');if(r.error||!r.data||!r.data.length){await pullSync(true);return}}
  sv=sv+1;S.sv=sv;S.syncUid=user.id;persist()}catch(e){}}
function applyRemote(d,union){applying=true;const lc=S.chats||[],lm=S.mems||[],lk=S.set.key;
 let chats=d.chats||[],mems=d.mems||[];
 if(union){const ci=new Set(chats.map(c=>c.id)),mi=new Set(mems.map(m=>m.id));chats=chats.concat(lc.filter(c=>!ci.has(c.id)));mems=mems.concat(lm.filter(m=>!mi.has(m.id)))}
 else mems=mems.concat(lm.filter(m=>m.b64));
 S.chats=chats;S.mems=mems;S.cur=chats.some(c=>c.id===d.cur)?d.cur:(chats.some(c=>c.id===S.cur)?S.cur:null);
 S.set=Object.assign({},S.set,d.set||{});['key','keys','bases','eps','cmods','cat','map','reals','real','usages'].forEach(k=>{delete S.set[k]});if(!S.set.model||/\|/.test(S.set.model))S.set.model=ML()[0]||'';S.use=d.use||S.use;applying=false}
async function pullSync(merge){if(!sb||!user||(syncT&&!merge)||gens.size)return;
 try{const r=await sb.from('user_state').select('data,version').eq('user_id',user.id).maybeSingle();if(r.error)return;
  if(!r.data){sv=0;await pushSync();return}
  const first=!!merge||S.syncUid!==user.id;if(!first&&r.data.version===sv)return;
  applyRemote(r.data.data||{},first);sv=r.data.version;S.sv=sv;S.syncUid=user.id;persist();applyTheme();renderAll();
  if(first)queuePush()}catch(e){}}
async function logout(){if(!await confirmD('Keluar dari akun?'))return;
 try{await pushNow()}catch(_){}try{await sb.auth.signOut()}catch(_){}try{localStorage.removeItem('chatbotai')}catch(_){}location.href='/chat/'}
function updAcct(){$('#acct').innerHTML=user?`<div class="ac"><span>${esc(user.email||'')}</span><button id="outb">Keluar</button></div>`:'<button class="btn p" id="inb">Masuk</button>';
 const o=$('#outb');if(o)o.onclick=logout;const i=$('#inb');if(i)i.onclick=openAuth;
 $('#inp').placeholder=user?'Tulis pesan…':'Masuk untuk mulai chat…'}
function setAuthMode(m){amode=m;document.querySelectorAll('#authTabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 $('#authT').textContent=m==='in'?'Masuk ke MultiAI':'Buat akun MultiAI';$('#ago').textContent=m==='in'?'Masuk':'Daftar';
 $('#apw').autocomplete=m==='in'?'current-password':'new-password';aerr('')}
function aerr(t,ok){const e=$('#aerr');e.textContent=t;e.style.color=ok?'var(--tx)':'var(--err)'}
function openAuth(){$('#authm').classList.add('on');setAuthMode(amode)}
const aMsg=m=>/invalid login/i.test(m)?'Email atau password salah.':/already registered|already been registered/i.test(m)?'Email sudah terdaftar. Silakan masuk.':/not confirmed/i.test(m)?'Email belum dikonfirmasi. Cek kotak masuk emailmu.':/rate limit|too many/i.test(m)?'Terlalu banyak percobaan. Coba lagi beberapa saat.':/password/i.test(m)?'Password minimal 6 karakter.':'Gagal: '+m;
async function doAuth(){const em=$('#aem').value.trim(),pw=$('#apw').value;
 if(!sb)return aerr(CFG_OK?'Layanan login tidak bisa dimuat. Periksa koneksi internet.':'Login belum dikonfigurasi. Isi SUPABASE_URL dan SUPABASE_KEY di chat/config.js.');
 if(!/^\S+@\S+\.\S+$/.test(em))return aerr('Email tidak valid.');
 if(pw.length<6)return aerr('Password minimal 6 karakter.');
 const b=$('#ago');b.disabled=true;aerr('');
 try{const r=amode==='in'?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});
  if(r.error)aerr(aMsg(r.error.message));
  else if(amode==='up'&&!(r.data&&r.data.session)){setAuthMode('in');aerr('Akun dibuat. Cek emailmu untuk konfirmasi, lalu masuk.',1)}
  else{$('#authm').classList.remove('on');$('#apw').value=''}}
 catch(e){aerr('Gagal terhubung. Coba lagi.')}
 b.disabled=false}
$('#authTabs').onclick=e=>{const b=e.target.closest('button');if(b)setAuthMode(b.dataset.m)};
$('#aclose').onclick=()=>$('#authm').classList.remove('on');
$('#ago').onclick=doAuth;$('#apw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth()});$('#aem').addEventListener('keydown',e=>{if(e.key==='Enter')$('#apw').focus()});
if(sb){sb.auth.onAuthStateChange((ev,ss)=>{const nu=(ss&&ss.user)||null,was=user;user=nu;updAcct();if(nu&&(!was||was.id!==nu.id)){$('#authm').classList.remove('on');setTimeout(pullSync,0)}});
 sb.auth.getSession().then(r=>{if(!(r.data&&r.data.session)&&/[?&]masuk/.test(location.search)){openAuth();try{history.replaceState(null,'',location.pathname)}catch(_){}}})}
else if(/[?&]masuk/.test(location.search))setTimeout(openAuth,0);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullSync()});
updAcct();
/* ---------- layar penuh preview + geser sidebar ---------- */
function togFull(on){const p=$('#panel');on=on===undefined?!p.classList.contains('full'):on;
 p.classList.toggle('full',on);$('#pfull').innerHTML=ic(on?'shrink':'expand',16);$('#pfull').title=on?'Keluar layar penuh':'Layar penuh';
 try{if(on&&p.requestFullscreen&&!document.fullscreenElement)p.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(_){}
 setTimeout(()=>{if(pf&&pf.lang==='pdf'&&pmode==='p'&&p.classList.contains('on'))pdfPreview(pf,$('#pb'))},300)}
$('#pfull').onclick=()=>togFull();
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&$('#panel').classList.contains('full'))togFull(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#panel').classList.contains('full'))togFull(false)});
const swipeOpen=(open,dx,dt,W)=>{const pos=Math.max(-W,Math.min(0,(open?0:-W)+dx)),v=dx/Math.max(dt,1);return v>.5?true:v<-.5?false:pos>-W*.5};
(function(){const side=$('#side'),mq=matchMedia('(max-width:820px)');let t=null;
 const W=()=>side.offsetWidth||290;
 const hscroll=el=>{while(el&&el!==document.body){if(el.scrollWidth>el.clientWidth+2){const o=getComputedStyle(el).overflowX;if(o==='auto'||o==='scroll')return true}el=el.parentElement}return false};
 const shade=pos=>'0 0 0 100vmax rgba(0,0,0,'+(.55*(1+pos/W())).toFixed(2)+')';
 document.addEventListener('touchstart',e=>{t=null;if(!mq.matches||e.touches.length!==1)return;const p=e.touches[0],open=side.classList.contains('on');
  if(!open&&(p.clientX>innerWidth*.55||hscroll(e.target)||e.target.closest('input,textarea,iframe,#panel,.modal,.ov')))return;
  t={x:p.clientX,y:p.clientY,t0:Date.now(),open,drag:false,dx:0}},{passive:true});
 document.addEventListener('touchmove',e=>{if(!t)return;const p=e.touches[0],dx=p.clientX-t.x,dy=p.clientY-t.y;
  if(!t.drag){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){t=null;return}
   if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5&&((!t.open&&dx>0)||(t.open&&dx<0))){t.drag=true;side.style.transition='none'}else return}
  t.dx=dx;const pos=Math.max(-W(),Math.min(0,(t.open?0:-W())+dx));side.style.transform='translateX('+pos+'px)';side.style.boxShadow=shade(pos)},{passive:true});
 document.addEventListener('touchend',()=>{if(!t||!t.drag){t=null;return}
  const open=swipeOpen(t.open,t.dx,Date.now()-t.t0,W());t=null;side.style.transition='';
  requestAnimationFrame(()=>{side.style.transform='';side.style.boxShadow='';side.classList.toggle('on',open)})},{passive:true});
 document.addEventListener('click',e=>{if(mq.matches&&side.classList.contains('on')&&!e.target.closest('#side,#menu')){e.stopPropagation();e.preventDefault();side.classList.remove('on')}},true)})();
const wb=$('#webb'),syncWeb=()=>wb.classList.toggle('on',!!S.set.web);
wb.onclick=()=>{S.set.web=!S.set.web;save();syncWeb()};syncWeb();
$('#msave').addEventListener('click',()=>renderAll());
renderAll();
loadModels(true);
if(/share=/.test(location.hash))handleShare(location.hash);
else if(/^\/s\/[A-Za-z0-9_-]{4,16}$/.test(location.pathname))handleShare(location.pathname);
addEventListener('hashchange',()=>{if(/share=/.test(location.hash))handleShare(location.hash)});
