const b64u=u=>{let t='';u.forEach(b=>t+=String.fromCharCode(b));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return Uint8Array.from(atob(t),c=>c.charCodeAt(0))};
async function pack(o){const raw=new TextEncoder().encode(JSON.stringify(o));
 if(window.CompressionStream){const st=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'));return 'z.'+b64u(new Uint8Array(await new Response(st).arrayBuffer()))}
 return 'p.'+b64u(raw)}
async function unpack(t){const k=t.slice(0,2);let u=unb64u(t.slice(2));
 if(k==='z.'){const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));u=new Uint8Array(await new Response(st).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(u))}
const shareObj=c=>({v:1,t:c.title,m:c.msgs.filter(m=>!m.err&&m.text).map(m=>[m.role==='user'?'u':'a',m.text,m.role==='model'?m.model:0,m.role==='model'&&m.src&&m.src.length?m.src.slice(0,6):0])});

 if(m){const r=await fetch((m[1]||shareOrigin())+'/api/share?id='+m[2]);if(!r.ok)throw new Error('x');return (await r.json()).d}
 return extract(x)}

 $('#dlg').innerHTML=`<div class="dm"><b>Bagikan chat</b><div class="note" style="margin-top:2px">${esc(c.title)}</div></div><textarea class="lk" readonly rows="4">${link}</textarea><p class="note">${short?'Link pendek ini tersimpan di server dan berlaku 30 hari. ':link.length>3500?'Link ini panjang ('+link.length+' karakter) dan bisa terpotong di aplikasi chat tertentu. ':''}Siapa pun yang punya link bisa membaca chat ini. API key dan memori tidak ikut terkirim.</p><div class="dbt"><button class="btn" data-k="c">Salin</button><button class="btn p" data-k="s">Bagikan</button></div>`;
 $('#dlgw').classList.add('on');
 $('#dlg').onclick=async e=>{const b=e.target.closest('button[data-k]');if(!b)return;

async function handleShare(x){let pl;try{pl=await resolveShare(x)}catch(_){note('Link chat tidak ditemukan atau sudah kedaluwarsa.');return}try{history.replaceState(null,'',/^\/s\//.test(location.pathname)?'/':location.pathname)}catch(_){}
